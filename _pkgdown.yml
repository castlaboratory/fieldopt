url: https://castlaboratory.github.io/fieldopt/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#2E6B3A"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

development:
  mode: auto

authors:
  André Leite:
    href: https://castlab.org
  Raydonal Ospina:
    href: https://castlab.org
  Cristiano Ferraz:
    href: https://castlab.org

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, lightswitch, github]

reference:
- title: Travel and cost
  contents: [travel_matrix, field_cost_model, as_frame, as_sf]
- title: Routing the field work
  contents: [route_fieldwork, schedule_fieldwork, schedule_calendar, autoplot.fieldopt_routes, autoplot.fieldopt_schedule, routes-methods]
- title: Selecting units and points
  contents: [select_units, select_points, spatial_balance, autoplot.fieldopt_sample]
- title: Estimating
  contents: [design_variance, ratio_estimator, dual_frame_estimator, segment_estimator, point_estimator, expected_hits, point_design_effect]
- title: Allocation
  contents: [frame_allocation, multivariate_allocation, dual_frame_allocation, two_stage_allocation, allocation-methods]
- title: Allocation with the routed field cost
  contents: [routed_unit_cost, two_stage_design, dual_frame_design]
- title: The cost-variance frontier
  contents: [cost_variance_frontier, autoplot.fieldopt_frontier]
- title: Engine
  contents: [core_version]
- title: Re-exports
  contents: [reexports]

articles:
- title: Get started
  navbar: ~
  contents: [fieldopt]
- title: Practice
  navbar: Practice
  contents: [area-and-dual-frame, routing-teams, frames-and-allocation]
