- title: Routing the field work
  contents: [route_fieldwork, autoplot.fieldopt_routes]
- title: Selecting units and estimating
  contents: [select_units, design_variance, frame_allocation]
- title: The cost-variance frontier
  contents: [cost_variance_frontier, autoplot.fieldopt_frontier]
- title: Engine
  contents: [core_version]
- title: Re-exports
  contents: [reexports]

articles:
- title: Get started
  navbar: ~
  contents: [fieldopt]
- title: Practice
  navbar: Practice
  contents: [routing-teams, frames-and-allocation]
