<svg xmlns="http://www.w3.org/2000/svg" width="850" height="420" viewBox="0 0 850 420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568"/></marker></defs>
<rect width="850" height="420" fill="#FFFFFF"/>
<text x="425" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1A202C">fieldopt workflow: one design, then the frontier</text>
<rect x="20" y="50" width="150" height="60" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.6"/>
<text x="95.0" y="65.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A202C">Frame</text>
<text x="95.0" y="87.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">units + depot,</text>
<text x="95.0" y="103.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">coordinates, size</text>
<rect x="240" y="50" width="170" height="60" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="325.0" y="65.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">travel_matrix()</text>
<text x="325.0" y="87.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">travel between</text>
<text x="325.0" y="103.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">all units</text>
<rect x="480" y="50" width="170" height="60" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="565.0" y="65.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">field_cost_model()</text>
<text x="565.0" y="87.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">cost per km,</text>
<text x="565.0" y="103.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">visit, interview</text>
<rect x="240" y="170" width="170" height="64" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="325.0" y="187.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">select_units()</text>
<text x="325.0" y="209.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">n units, known pi,</text>
<text x="325.0" y="225.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">spatially balanced</text>
<rect x="480" y="170" width="170" height="64" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="565.0" y="187.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">route_fieldwork()</text>
<text x="565.0" y="209.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">routes from the depot</text>
<text x="565.0" y="225.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">under the limits</text>
<rect x="700" y="170" width="130" height="64" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="765.0" y="187.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A202C">Field cost</text>
<text x="765.0" y="209.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">travel + visits</text>
<text x="765.0" y="225.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">+ interviews</text>
<rect x="240" y="300" width="170" height="64" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="325.0" y="317.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">design_variance()</text>
<text x="325.0" y="339.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">HT total,</text>
<text x="325.0" y="355.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">local-mean variance</text>
<rect x="480" y="300" width="170" height="64" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="565.0" y="317.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A202C">Precision</text>
<text x="565.0" y="339.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">variance, SE, CV</text>
<text x="565.0" y="355.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">vs SRS</text>
<rect x="20" y="300" width="200" height="64" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="120.0" y="318.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A202C">cost_variance_frontier()</text>
<text x="120.0" y="339.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">repeats the cycle</text>
<text x="120.0" y="354.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">for each n in a grid</text>
<polyline points="170,80 240,80" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="95,110 95,200" fill="none" stroke="#4A5568" stroke-width="1.8"/>
<polyline points="95,200 240,200" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="325,110 325,170" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="410,202 480,202" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="565,110 565,170" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="650,202 700,202" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="325,234 325,300" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="410,332 480,332" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="115,300 115,222" fill="none" stroke="#4A5568" stroke-width="1.8" stroke-dasharray="6 4"/>
<polyline points="115,222 240,222" fill="none" stroke="#4A5568" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="425" y="398" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#718096" font-style="italic">Dashed: cost_variance_frontier() runs select, route, price and estimate for every n and averages cost and variance</text>
</svg>
