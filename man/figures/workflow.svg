<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568"/></marker></defs>
<rect width="840" height="420" fill="#FFFFFF"/>
<text x="420" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1A202C">fieldopt workflow: one design, then the frontier</text>
<rect x="20" y="50" width="140" height="60" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.6"/>
<text x="90.0" y="65.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A202C">Frame</text>
<text x="90.0" y="87.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">units + depot,</text>
<text x="90.0" y="103.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">coordinates, size</text>
<rect x="230" y="50" width="170" height="60" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="315.0" y="65.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">travel_matrix()</text>
<text x="315.0" y="87.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">travel between</text>
<text x="315.0" y="103.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">all units</text>
<rect x="470" y="50" width="170" height="60" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="555.0" y="65.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">field_cost_model()</text>
<text x="555.0" y="87.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">cost per km,</text>
<text x="555.0" y="103.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">visit, interview</text>
<rect x="230" y="170" width="170" height="60" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="315.0" y="185.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">select_units()</text>
<text x="315.0" y="207.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">n units, known pi,</text>
<text x="315.0" y="223.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">spatially balanced</text>
<rect x="470" y="170" width="170" height="60" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="555.0" y="185.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">route_fieldwork()</text>
<text x="555.0" y="207.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">routes from the depot</text>
<text x="555.0" y="223.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">under the limits</text>
<rect x="690" y="170" width="130" height="60" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="755.0" y="185.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A202C">Field cost</text>
<text x="755.0" y="207.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">travel + visits</text>
<text x="755.0" y="223.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">+ interviews</text>
<rect x="470" y="290" width="170" height="60" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="555.0" y="305.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">design_variance()</text>
<text x="555.0" y="327.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">HT total,</text>
<text x="555.0" y="343.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">local-mean variance</text>
<rect x="690" y="290" width="130" height="60" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="755.0" y="305.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1A202C">Precision</text>
<text x="755.0" y="327.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">variance, SE, CV</text>
<text x="755.0" y="343.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2D3748">vs SRS</text>
<rect x="20" y="290" width="380" height="60" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="210.0" y="306.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">cost_variance_frontier()</text>
<text x="210.0" y="327.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">repeats the cycle for each n in a grid:</text>
<text x="210.0" y="342.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">mean cost and mean variance per n</text>
<polyline points="160,80 230,80" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="90,110 90,200" fill="none" stroke="#4A5568" stroke-width="1.8"/>
<polyline points="90,200 230,200" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="315,110 315,170" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="400,200 470,200" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="555,110 555,170" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="640,200 690,200" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="315,230 315,320" fill="none" stroke="#4A5568" stroke-width="1.8"/>
<polyline points="315,320 470,320" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="640,320 690,320" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="200,290 200,218" fill="none" stroke="#4A5568" stroke-width="1.8" stroke-dasharray="6 4"/>
<polyline points="200,218 230,218" fill="none" stroke="#4A5568" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="420" y="392" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#718096" font-style="italic">Dashed: cost_variance_frontier() runs select, route, price and estimate for every n</text>
</svg>
