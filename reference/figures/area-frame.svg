<text x="330.0" y="89.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">stratified LPM or</text>
<text x="330.0" y="104.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">systematic with replicates</text>
