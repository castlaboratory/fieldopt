<svg xmlns="http://www.w3.org/2000/svg" width="240" height="278" viewBox="0 0 240 278">
  <defs>
    <clipPath id="hex">
      <polygon points="120,6 234,72 234,206 120,272 6,206 6,72"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A26"/>
      <stop offset="1" stop-color="#0E1C12"/>
    </linearGradient>
  </defs>
  <polygon points="120,6 234,72 234,206 120,272 6,206 6,72" fill="url(#bg)" stroke="#2E6B3A" stroke-width="7" stroke-linejoin="round"/>
  <g clip-path="url(#hex)" transform="translate(20,14) scale(0.84)">
    <!-- field grid -->
    <g stroke="#3F6B4A" stroke-width="1.5" stroke-opacity="0.6">
      <line x1="30" y1="70" x2="210" y2="70"/><line x1="30" y1="110" x2="210" y2="110"/>
      <line x1="30" y1="150" x2="210" y2="150"/><line x1="30" y1="190" x2="210" y2="190"/>
      <line x1="70" y1="40" x2="70" y2="210"/><line x1="110" y1="40" x2="110" y2="210"/>
      <line x1="150" y1="40" x2="150" y2="210"/><line x1="190" y1="40" x2="190" y2="210"/>
    </g>
    <!-- units not selected -->
    <g fill="#8FA896" fill-opacity="0.55">
      <circle cx="50" cy="90" r="4"/><circle cx="90" cy="60" r="4"/><circle cx="130" cy="95" r="4"/>
      <circle cx="170" cy="60" r="4"/><circle cx="200" cy="130" r="4"/><circle cx="90" cy="170" r="4"/>
      <circle cx="130" cy="200" r="4"/><circle cx="50" cy="200" r="4"/><circle cx="170" cy="200" r="4"/>
    </g>
    <!-- route from the depot through the selected units -->
    <polyline fill="none" stroke="#E8A33D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
      points="120,135 60,130 70,55 130,45 185,90 195,170 140,160 120,135"/>
    <g fill="#3EC97A" stroke="#0E1C12" stroke-width="1.5">
      <circle cx="60" cy="130" r="6"/><circle cx="70" cy="55" r="6"/><circle cx="130" cy="45" r="6"/>
      <circle cx="185" cy="90" r="6"/><circle cx="195" cy="170" r="6"/><circle cx="140" cy="160" r="6"/>
    </g>
    <!-- depot -->
    <polygon points="120,122 132,143 108,143" fill="#F2F4F7" stroke="#B4432B" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="120" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#F2F4F7">fieldopt</text>
</svg>
