<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568"/></marker></defs>
<rect width="760" height="420" fill="#FFFFFF"/>
<rect x="300" y="120" width="420" height="200" rx="12" fill="none" stroke="#2B5F8A" stroke-width="1.4" stroke-dasharray="7 5"/>
<rect x="40" y="56" width="420" height="200" rx="12" fill="none" stroke="#2E6B3A" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="380" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1A202C">Dual frame: an area frame and a list frame that overlap</text>
<rect x="50" y="47.0" width="314" height="18" fill="#FFFFFF"/>
<text x="54" y="60.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2E6B3A">Area frame A: every holding in the territory</text>
<rect x="310" y="111.0" width="238" height="18" fill="#FFFFFF"/>
<text x="314" y="124.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B5F8A">List frame B: registered holdings</text>
<rect x="70" y="100" width="190" height="64" rx="8" fill="#E8F3EA" stroke="#2E6B3A" stroke-width="1.6"/>
<text x="165.0" y="118.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">Domain a</text>
<text x="165.0" y="139.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">holdings only reachable</text>
<text x="165.0" y="154.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">through the area sample</text>
<rect x="310" y="160" width="140" height="64" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="380.0" y="178.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">Domain ab</text>
<text x="380.0" y="199.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">in both frames:</text>
<text x="380.0" y="214.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">the overlap</text>
<rect x="500" y="220" width="190" height="64" rx="8" fill="#E6EEF6" stroke="#2B5F8A" stroke-width="1.6"/>
<text x="595.0" y="238.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">Domain b</text>
<text x="595.0" y="259.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">on the list only</text>
<text x="595.0" y="274.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">(outside the area frame)</text>
<rect x="40" y="300" width="330" height="90" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.6"/>
<text x="205.0" y="332.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A202C">Screening design, theta = 0</text>
<text x="205.0" y="352.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2D3748">overlap holdings found by the area sample are dropped;</text>
<text x="205.0" y="366.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2D3748">the list covers them completely; simplest in the field</text>
<rect x="390" y="300" width="330" height="90" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.6"/>
<text x="555.0" y="332.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A202C">Mixing design, 0 &lt; theta &lt; 1</text>
<text x="555.0" y="352.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2D3748">both samples estimate the overlap; theta chosen to</text>
<text x="555.0" y="366.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2D3748">minimise the variance (Hartley) or by Fuller-Burmeister</text>
<text x="380" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#718096" font-style="italic">dual_frame_allocation() chooses n_A, n_B and theta; frame_overlap() finds ab; dual_frame_estimator() combines the samples</text>
</svg>
