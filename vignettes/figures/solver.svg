<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568"/></marker></defs>
<rect width="860" height="500" fill="#FFFFFF"/>
<text x="430" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1A202C">Inside route_fieldwork(): how a routing problem is solved and proven</text>
<rect x="20" y="50" width="240" height="64" rx="8" fill="#FDEEEA" stroke="#B4432B" stroke-width="1.6"/>
<text x="140.0" y="68.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">Up to 13 units: exact</text>
<text x="140.0" y="89.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">dynamic programme over subsets,</text>
<text x="140.0" y="104.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">any number of depots</text>
<rect x="600" y="50" width="240" height="64" rx="8" fill="#FDEEEA" stroke="#B4432B" stroke-width="1.6"/>
<text x="720.0" y="68.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A202C">More units: genetic search</text>
<text x="720.0" y="89.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">population of giant tours, order</text>
<text x="720.0" y="104.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">crossover, restarts, time limit</text>
<rect x="600" y="170" width="240" height="64" rx="8" fill="#FDEEEA" stroke="#B4432B" stroke-width="1.6"/>
<text x="720.0" y="188.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">Split (Prins)</text>
<text x="720.0" y="209.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">optimal cut into routes, depot per</text>
<text x="720.0" y="224.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">route, fleet cap, penalised excess</text>
<rect x="600" y="290" width="240" height="64" rx="8" fill="#FDEEEA" stroke="#B4432B" stroke-width="1.6"/>
<text x="720.0" y="309.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">Local search</text>
<text x="720.0" y="329.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2D3748">2-opt, Or-opt, relocate, swap, SWAP*,</text>
<text x="720.0" y="343.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2D3748">2-opt*, depot change; O(1) pricing</text>
<rect x="300" y="170" width="260" height="64" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="430.0" y="188.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">Solution</text>
<text x="430.0" y="209.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">routes, durations, loads,</text>
<text x="430.0" y="224.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">lower bound, optimal</text>
<rect x="20" y="170" width="240" height="64" rx="8" fill="#FDEEEA" stroke="#B4432B" stroke-width="1.6"/>
<text x="140.0" y="189.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">Certificate</text>
<text x="140.0" y="209.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2D3748">takes a single tour; branch-and-bound</text>
<text x="140.0" y="223.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2D3748">on 1-trees returns the proof or the gap</text>
<rect x="20" y="290" width="240" height="64" rx="8" fill="#FDEEEA" stroke="#B4432B" stroke-width="1.6"/>
<text x="140.0" y="308.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">Bounds</text>
<text x="140.0" y="329.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">Held-Karp 1-tree (single tour),</text>
<text x="140.0" y="344.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">in/out edges otherwise</text>
<polyline points="260,82 430,82 430,170" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="321.0" y="55.0" width="48.0" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="345.0" y="67.3" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A5568">optimal</text>
<polyline points="720,114 720,170" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="720,234 720,290" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="840,322 852,322 852,82 840,82" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="600,322 430,322 430,234" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="473.8" y="332.0" width="82.4" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="515.0" y="344.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A5568">best feasible</text>
<polyline points="300,192 260,192" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="260,212 300,212" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="140,290 140,234" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="430" y="390" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#718096" font-style="italic">Adaptive penalties on excess load, duration, stops and routes per depot let the search cross infeasible solutions</text>
<text x="430" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#718096" font-style="italic">(feasible and infeasible subpopulations, Vidal 2022); the loop on the right runs until the offspring or the time run out.</text>
<text x="430" y="446" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#718096" font-style="italic">Validation: optimal on TSPLIB (7 of 7), 24 of 27 Augerat CVRP optima, at or below the best known on 11 to 13 of the 23 Cordeau MDVRP instances;</text>
<text x="430" y="466" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#718096" font-style="italic">every move priced in constant time and checked against full recomputation; exact DP and split checked against brute force.</text>
</svg>
